name: fetch latest versions
on:
  push:
    branches: ["latest"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: ["latest"]
  schedule:
    - cron: "13 */8 * * *"
jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch push date
        run: |
          curl -sL https://api.github.com/repos/RandomNinjaAtk/arr-scripts | \
          jq -r ".pushed_at" > latest-arr-scripts.txt
      - name: Fetch release version
        run: |
          curl -sL https://api.github.com/repos/linuxserver/docker-lidarr/releases/latest | \
          jq -r ".tag_name" > latest-lidarr.txt
      - name: Check for modified files
        id: git-check
        run: echo "modified=$([ -z "`git status --porcelain`" ] && echo "false" || echo "true")" >> $GITHUB_OUTPUT
      - name: Commit latest release version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'PrinceFrosty'
          git config --global user.email '33556237+PrinceFrosty@users.noreply.github.com'
          git commit -am "New release version"
      - name: Push changes
        if: steps.git-check.outputs.modified == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
