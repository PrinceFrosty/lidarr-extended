services:
  lidarr:
    security_opt: ["no-new-privileges:true"]
    image: ghcr.io/princefrosty/lidarr-extended:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      PGID: 1000
      PUID: 1000
    volumes:
      - "./config-lidarr/config/:/config/"
      - "./data:/data/"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://eth0.me",
          "&&",
          "curl",
          "-f",
          "http://localhost:8686",
        ]
      interval: 180s
      timeout: 10s
      retries: 3
    ports:
      - "8686:8686"
