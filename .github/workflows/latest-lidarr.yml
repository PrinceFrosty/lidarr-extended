name: Get latest release version
on:
   push:
    branches: [ "latest" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
   pull_request:
    branches: [ "latest" ]
   schedule:
    - cron:  '0 10 * * *'
env:
  REPO_SCOPED_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          token: ${{ secrets.REPO_SCOPED_TOKEN }}
      - name: Fetch release version
        run: |
          curl -sL https://api.github.com/repos/linuxserver/docker-lidarr/releases/latest | \
          jq -r ".tag_name" > .github/workflows/latest-lidarr.txt
      - name: Check for modified files
        id: git-check
        run: echo ::set-output name=modified::$([ -z "`git status --porcelain`" ] && echo "false" || echo "true")
      - name: Commit latest release version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'PrinceFrosty'
          git config --global user.email '33556237+PrinceFrosty@users.noreply.github.com'
          git commit -am "New release version"
          git push
